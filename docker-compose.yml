version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - AZURE_OPENAI_ENDPOINT=${AZURE_OPENAI_ENDPOINT}
      - AZURE_OPENAI_API_KEY=${AZURE_OPENAI_API_KEY}
      - AZURE_OPENAI_DEPLOYMENT=${AZURE_OPENAI_DEPLOYMENT:-gpt-5.4}
      - AZURE_OPENAI_EMBEDDING_DEPLOYMENT=${AZURE_OPENAI_EMBEDDING_DEPLOYMENT:-text-embedding-3-large}
      - AZURE_OPENAI_API_VERSION=${AZURE_OPENAI_API_VERSION:-2024-02-01}
      - AZURE_SEARCH_ENDPOINT=${AZURE_SEARCH_ENDPOINT}
      - AZURE_SEARCH_API_KEY=${AZURE_SEARCH_API_KEY}
      - AZURE_SEARCH_INDEX_NAME=cost-interpretation-guidelines
      - APPINSIGHTS_INSTRUMENTATION_KEY=${APPINSIGHTS_INSTRUMENTATION_KEY}
      - APP_ENV=${APP_ENV:-mock}

  frontend:
    build: .
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_APP_ENV=${APP_ENV:-mock}
      - NEXT_PUBLIC_FORCE_BACKEND=true
      - BACKEND_URL=http://backend:8000
      - OPTUM_CLIENT_ID=${OPTUM_CLIENT_ID}
      - OPTUM_CLIENT_SECRET=${OPTUM_CLIENT_SECRET}
      - OPTUM_AUTH_URL=${OPTUM_AUTH_URL}
      - OPTUM_ELIGIBILITY_URL=${OPTUM_ELIGIBILITY_URL}
      - OPTUM_PROVIDER_TAX_ID=${OPTUM_PROVIDER_TAX_ID}
      - AUTH_USERNAME=${AUTH_USERNAME:-admin}
      - AUTH_PASSWORD_HASH=${AUTH_PASSWORD_HASH}
      - AUTH_SECRET=${AUTH_SECRET}
    depends_on:
      - backend
